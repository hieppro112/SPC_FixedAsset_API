spring.application.name=scan-machine-api
server.port=8080
# Connection comes from environment variables - never put credentials in this file.
# Example DB_URL: jdbc:sqlserver://192.168.122.2:1433;databaseName=F2Database;encrypt=true;trustServerCertificate=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
